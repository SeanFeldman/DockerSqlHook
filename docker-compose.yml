# Docker Compose for local SQL Server development.
#
# Usage:
#   docker compose up -d
#
# The SQL password here should match what you pass to Install-DockerSqlHook.ps1.
# Databases are persisted in a named volume so they survive container restarts.
#
# To create your application databases, connect with:
#   sqlcmd -S localhost,1433 -U sa -P Dev@12345 -Q "CREATE DATABASE [YourDb]"
#
# Or mount an init script (see init-db.sql.example).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqldev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
